<div class="admin-layout">
  <div class="sidebar-overlay" [class.visible]="sidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-header">
      <div>
        <h2>Conteo Electoral</h2>
        <span class="sidebar-subtitle">Sistema de Votación</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ng-container *ngIf="adminNavItemsFiltered.length > 0">
        <span class="nav-section-title">Administración</span>
        <a *ngFor="let item of adminNavItemsFiltered" [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
          <i class="nav-icon bi" [ngClass]="item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
          <span class="nav-indicator"></span>
        </a>
      </ng-container>
      <ng-container *ngIf="navItemsFiltered.length > 0">
        <span class="nav-section-title" style="margin-top: 8px;">Menú Principal</span>
        <a *ngFor="let item of navItemsFiltered" [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
          <i class="nav-icon bi" [ngClass]="item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
          <span class="nav-indicator"></span>
        </a>
      </ng-container>
    </nav>
  </aside>

  <div class="content-wrapper">
    <header class="top-header">
      <div class="header-left">
        <button (click)="toggleSidebar()" class="sidebar-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
        <span class="header-brand">Conteo Electoral</span>
      </div>
      <div class="header-right">
        <div class="header-user-info">
          <span class="header-user-name">{{ userName }}</span>
          <span class="header-role-badge" [class.admin]="userRole === 'ADMIN'"
            [class.supervisor]="userRole === 'SUPERVISOR'">
            {{ userRole === 'ADMIN' ? 'Administrador' : 'Supervisor' }}
          </span>
        </div>
        <button (click)="toggleTheme()" class="theme-toggle" [title]="isDark ? 'Modo claro' : 'Modo oscuro'"
          [attr.aria-label]="isDark ? 'Activar modo claro' : 'Activar modo oscuro'">
          <i class="bi" [class.bi-sun]="isDark" [class.bi-moon-stars]="!isDark"></i>
        </button>
        <button (click)="logout()" class="btn btn-outline-light btn-sm header-logout">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <div class="footer-brand">
        <span class="footer-logo-placeholder"></span>
        <strong>ALANTEK</strong>
      </div>
      <span>&copy; 2026 Sistema de Conteo Electoral. Todos los derechos reservados.</span>
    </footer>
  </div>
</div>
