<div class="admin-layout" [class.sidebar-collapsed]="sidebarCollapsed">
  <div class="sidebar-overlay" [class.visible]="sidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-logo-mini">CE</span>
        <div class="sidebar-brand-text">
          <h2>Conteo Electoral</h2>
          <span class="sidebar-subtitle">Sistema de Votación</span>
        </div>
      </div>
      <button aria-label="Página anterior" type="button" class="btn sidebar-collapse-btn btn-xs icon-only" (click)="toggleCollapse()"
        [title]="sidebarCollapsed ? 'Expandir menú' : 'Contraer menú'"
        [attr.aria-label]="sidebarCollapsed ? 'Expandir menú' : 'Contraer menú'"
        [attr.aria-expanded]="!sidebarCollapsed"><i class="bi bi-chevron-left"></i></button>
    </div>

    <nav class="sidebar-nav">
      <!-- Rail de solo iconos cuando el sidebar está contraído -->
      <ng-container *ngIf="sidebarCollapsed; else groupedNav">
        <span class="nav-section-title">Menú</span>
        <a *ngFor="let item of allNavItemsFiltered" [routerLink]="item.path" routerLinkActive="active"
          class="nav-item" [title]="item.label" [attr.aria-label]="item.label" (click)="closeSidebar()">
          <i class="nav-icon bi" [ngClass]="item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
          <span class="nav-indicator"></span>
        </a>
      </ng-container>

      <!-- Navegación agrupada por flujo de trabajo -->
      <ng-template #groupedNav>
        <div class="nav-group" *ngFor="let group of navGroupsFiltered"
          [class.active]="isGroupActive(group)" [class.expanded]="isGroupExpanded(group.key)">
          <button type="button" class="nav-group-header" (click)="toggleGroup(group.key)"
            [attr.aria-expanded]="isGroupExpanded(group.key)"
            [attr.aria-label]="'Mostrar u ocultar ' + group.label" [title]="group.label">
            <i class="nav-group-icon bi" [ngClass]="group.icon"></i>
            <span class="nav-group-text">{{ group.label }}</span>
            <i class="nav-group-chevron bi"
              [ngClass]="isGroupExpanded(group.key) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
          </button>
          <div class="nav-group-items" *ngIf="isGroupExpanded(group.key)">
            <a *ngFor="let item of group.items" [routerLink]="item.path" routerLinkActive="active"
              class="nav-item nav-subitem" [title]="item.label" (click)="closeSidebar()">
              <i class="nav-icon bi" [ngClass]="item.icon"></i>
              <span class="nav-text">{{ item.label }}</span>
              <span class="nav-indicator"></span>
            </a>
          </div>
        </div>
      </ng-template>
    </nav>
  </aside>

  <div class="content-wrapper">
    <header class="top-header">
      <div class="header-left">
        <button title="Opciones" (click)="toggleSidebar()" class="btn sidebar-toggle btn-xs btn-labeled" aria-label="Mostrar u ocultar menú"><i class="bi bi-list"></i><span class="btn-label">Opciones</span></button>
        <span class="header-brand">Conteo Electoral</span>
      </div>
      <div class="header-right">
        <div class="header-user-info">
          <span class="header-user-name">{{ userName }}</span>
          <span class="header-role-badge" [class.admin]="userRole === 'ADMIN'"
            [class.supervisor]="userRole === 'SUPERVISOR'"
            [class.visitante]="userRole === 'VISITANTE'">
            {{ roleLabel }}
          </span>
        </div>
        <button (click)="toggleTheme()" class="btn theme-toggle btn-xs icon-only" [title]="isDark ? 'Modo claro' : 'Modo oscuro'"
          [attr.aria-label]="isDark ? 'Activar modo claro' : 'Activar modo oscuro'"><i class="bi bi-sun"></i></button>
        <button aria-label="Salir" title="Salir" (click)="logout()" class="btn btn-outline-light header-logout btn-xs btn-labeled"><i class="bi bi-box-arrow-right"></i><span class="btn-label">Salir</span></button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <div class="footer-brand">
        <span class="footer-logo-placeholder"></span>
        <strong>ALANTEK</strong>
      </div>
      <span>&copy; 2026 Sistema de Conteo Electoral. Todos los derechos reservados.</span>
    </footer>
  </div>
</div>
