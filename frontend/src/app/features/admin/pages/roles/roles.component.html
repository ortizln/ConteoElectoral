<div class="roles-container">
  <div class="page-header">
    <h1>Roles y Permisos</h1>
  </div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>

  <div class="roles-tabs">
    <button aria-label="Acción" title="Acción" *ngFor="let r of roles"
      class="btn tab-btn btn-xs btn-labeled"
      [class.active]="selectedRolId === r.id"
      (click)="selectRol(r.id)">
      {{ r.nombre }}
    </button>
  </div>

  <div *ngIf="loading" class="loading">Cargando permisos...</div>

  <div *ngIf="!loading && permisos.length > 0" class="permisos-table-card">
    <table class="table">
      <thead>
        <tr>
          <th>Módulo</th>
          <th class="text-center">Ver</th>
          <th class="text-center">Crear</th>
          <th class="text-center">Editar</th>
          <th class="text-center">Eliminar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of permisos">
          <td>{{ p.modulo }}</td>
          <td class="text-center">
            <button [attr.aria-label]="(p.puedeVer ? 'Desactivar' : 'Activar') + ' permiso de ver de ' + p.modulo"
              [attr.title]="(p.puedeVer ? 'Desactivar' : 'Activar') + ' permiso de ver de ' + p.modulo"
              class="btn toggle-btn btn-xs icon-only" [class.active]="p.puedeVer" (click)="togglePermiso(p, 'puedeVer')" [disabled]="saving"><i class="bi bi-check-lg"></i></button>
          </td>
          <td class="text-center">
            <button [attr.aria-label]="(p.puedeCrear ? 'Desactivar' : 'Activar') + ' permiso de crear de ' + p.modulo"
              [attr.title]="(p.puedeCrear ? 'Desactivar' : 'Activar') + ' permiso de crear de ' + p.modulo"
              class="btn toggle-btn btn-xs icon-only" [class.active]="p.puedeCrear" (click)="togglePermiso(p, 'puedeCrear')" [disabled]="saving"><i class="bi bi-check-lg"></i></button>
          </td>
          <td class="text-center">
            <button [attr.aria-label]="(p.puedeEditar ? 'Desactivar' : 'Activar') + ' permiso de editar de ' + p.modulo"
              [attr.title]="(p.puedeEditar ? 'Desactivar' : 'Activar') + ' permiso de editar de ' + p.modulo"
              class="btn toggle-btn btn-xs icon-only" [class.active]="p.puedeEditar" (click)="togglePermiso(p, 'puedeEditar')" [disabled]="saving"><i class="bi bi-check-lg"></i></button>
          </td>
          <td class="text-center">
            <button [attr.aria-label]="(p.puedeEliminar ? 'Desactivar' : 'Activar') + ' permiso de eliminar de ' + p.modulo"
              [attr.title]="(p.puedeEliminar ? 'Desactivar' : 'Activar') + ' permiso de eliminar de ' + p.modulo"
              class="btn toggle-btn btn-xs icon-only" [class.active]="p.puedeEliminar" (click)="togglePermiso(p, 'puedeEliminar')" [disabled]="saving"><i class="bi bi-check-lg"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="saving" class="saving-text">Guardando...</p>
  </div>

  <div *ngIf="!loading && permisos.length === 0" class="empty-state">
    No hay permisos configurados para este rol.
  </div>
</div>
