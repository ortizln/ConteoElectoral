<div class="page-wrapper">
  <div class="page-header">
    <h2>Carrusel de Imágenes</h2>
    <p>Administra las imágenes que se muestran en la pantalla de inicio de sesión</p>
  </div>

  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

  <div class="card upload-card">
    <h5>Agregar Nueva Imagen</h5>
    <div class="upload-form">
      <div class="form-row">
        <div class="form-group">
          <label class="sm" for="newFile">Imagen</label>
          <input class="sm" type="file" autocomplete="off" (change)="onFileSelected($event)" accept="image/png,image/jpeg,image/webp" id="newFile" />
          <label for="newFile" class="file-label sm">{{ selectedFile ? selectedFile.name : 'Seleccionar imagen...' }}</label>
        </div>
        <div class="form-group">
          <label class="sm" for="newCaption">Descripción</label>
          <input id="newCaption" type="text" class="form-control sm form-control-sm" autocomplete="off" [(ngModel)]="newCaption" placeholder="Texto que se muestra en el carrusel" />
        </div>
      </div>
      <button aria-label="Subir" title="Subir" class="btn btn-primary btn-xs btn-labeled" (click)="uploadImage()" [disabled]="!selectedFile || uploading"><span *ngIf="uploading" class="spinner-border spinner-border-sm"></span><i *ngIf="!uploading" class="bi bi-cloud-upload"></i><span class="btn-label">Subir</span></button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div></div>

  <div *ngIf="!loading && images.length === 0" class="card empty-card">
    <p>No hay imágenes en el carrusel. Agrega una nueva imagen usando el formulario de arriba.</p>
  </div>

  <div *ngIf="!loading && images.length > 0" class="images-grid">
    <div *ngFor="let img of images" class="image-card">
      <div class="img-preview">
        <img [src]="getImageUrl(img.id)" [alt]="img.caption" />
      </div>
      <div class="img-info">
        <div *ngIf="editingId !== img.id" class="img-details">
          <span class="img-caption">{{ img.caption }}</span>
          <span class="img-orden">Orden: {{ img.orden }}</span>
        </div>
        <div *ngIf="editingId === img.id" class="img-edit">
          <input type="text" class="form-control form-control-sm sm" autocomplete="off" [(ngModel)]="editCaption" placeholder="Descripción" />
          <input type="number" class="form-control form-control-sm sm" autocomplete="off" [(ngModel)]="editOrden" min="0" placeholder="Orden" />
        </div>
        <div class="img-actions">
          <div *ngIf="editingId !== img.id" class="btn-group">
            <button aria-label="Editar" title="Editar" class="btn btn-outline-primary btn-xs btn-labeled" (click)="startEdit(img)"><i class="bi bi-pencil-square"></i><span class="btn-label">Editar</span></button>
            <button aria-label="Eliminar" title="Eliminar" class="btn btn-outline-danger btn-xs btn-labeled" (click)="deleteImage(img.id)"><i class="bi bi-trash"></i><span class="btn-label">Eliminar</span></button>
          </div>
          <div *ngIf="editingId === img.id" class="btn-group">
            <button aria-label="Guardar" title="Guardar" class="btn btn-primary btn-xs btn-labeled" (click)="saveEdit(img.id)"><i class="bi bi-save"></i><span class="btn-label">Guardar</span></button>
            <button aria-label="Cerrar" title="Cerrar" class="btn btn-outline-secondary btn-xs btn-labeled" (click)="cancelEdit()"><i class="bi bi-x-lg"></i><span class="btn-label">Cerrar</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
