server:
  port: 8081

spring:
  application:
    name: conteo-electoral
  datasource:
    url: jdbc:h2:mem:e2etestdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25hbmRWYWxpZGF0aW9uMjAyNENvbnRlby1FbGVjdG9yYWxTeXN0ZW0=
  expiration: 86400000

cors:
  allowed-origins: http://localhost:4200, *

logging:
  level:
    root: INFO
    com.electoral: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
