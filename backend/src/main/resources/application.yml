server:
  port: 8081

spring:
  application:
    name: conteo-electoral
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

# OpenWA - gateway de WhatsApp usado para recuperación de contraseñas
openwa:
  base-url: ${OPENWA_BASE_URL:http://192.168.1.43:2785}
  api-key: ${OPENWA_API_KEY:}
  session-id: ${OPENWA_SESSION_ID:ecbae1a0-8d06-437b-b211-dac91a23ab2b}
  sender-number: ${OPENWA_SENDER_NUMBER:593985096366}

# JWT Configuration - Base64 encoded secret key (minimum 256 bits)
jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25hbmRWYWxpZGF0aW9uMjAyNENvbnRlby1FbGVjdG9yYWxTeXN0ZW0=
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:4200, *

# Logging
logging:
  level:
    root: INFO
    com.electoral: DEBUG
    org.springframework.security: DEBUG

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
