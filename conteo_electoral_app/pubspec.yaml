name: conteo_electoral_app
description: Aplicación móvil para conteo electoral offline
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  connectivity_plus: ^5.0.2
  intl: ^0.18.1
  package_info_plus: ^8.0.0
  flutter_secure_storage: ^9.0.0
  stomp_dart_client: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono.png"
  adaptive_icon_background: "#48563C"
  adaptive_icon_foreground: "assets/icono.png"
  web:
    generate: true
    image_path: "assets/icono.png"
    background_color: "#48563C"
    theme_color: "#48563C"

flutter:
  uses-material-design: true
  assets:
    - assets/icono.png
